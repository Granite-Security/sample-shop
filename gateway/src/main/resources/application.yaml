server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
  security:
    oauth2:
      client:
        provider:
          oidc-client:
            authorization-uri: ${OIDC_AUTHORIZATION_URI:${OIDC_ISSUER_URI:http://localhost:9090}/oauth2/authorize}
            token-uri: ${OIDC_TOKEN_URI:${OIDC_ISSUER_URI:http://localhost:9090}/oauth2/token}
            jwk-set-uri: ${OIDC_JWK_SET_URI:${OIDC_ISSUER_URI:http://localhost:9090}/oauth2/jwks}
            user-info-uri: ${OIDC_USER_INFO_URI:${OIDC_ISSUER_URI:http://localhost:9090}/userinfo}
            user-name-attribute: sub
        registration:
          oidc-client:
            provider: oidc-client
            client-id: oidc-client
            client-secret: ${OIDC_CLIENT_SECRET:secret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: ${OIDC_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
  codec:
    max-in-memory-size: 10MB

microservices:
  greetings:
    uri: ${GREETINGS_MICROSERVICE:http://localhost:8060}
  shop:
    uri: ${SHOP_MICROSERVICE:http://localhost:8061}

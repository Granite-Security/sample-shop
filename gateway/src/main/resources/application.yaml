server:
  port: 8080
  # Deliberately NOT set: this enables Spring's ForwardedHeaderTransformer,
  # which rewrites the exchange's own request URI from X-Forwarded-* and then
  # strips those headers from it — verified in production that this caused
  # X-Forwarded-Host from nginx to disappear before Spring Cloud Gateway's own
  # proxy filters could forward it on to auth-server, so auth-server fell back
  # to deriving its issuer from gateway's internal upstream URI
  # (http://auth-server:9090) instead of the real public domain. Gateway
  # itself doesn't need to resolve its own external URL for anything (no more
  # absolute-URL construction in RouterConfig), so leaving this off and
  # letting Spring Cloud Gateway's default proxy behavior pass the header
  # through untouched is what actually works.
spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Everything below lives under server.webflux. Spring Cloud Gateway 4.2
      # relocated these keys and 5.x dropped the old spring.cloud.gateway.*
      # forms entirely — they are not in the configuration metadata even as
      # deprecated aliases, so the previous placement bound to nothing and was
      # silently ignored. That is why the pool settings appeared not to work.
      server:
        webflux:
          httpclient:
            pool:
              # Pooled connections outlive the pods behind them. On every deploy
              # a backend pod is replaced and its IP goes away, but the gateway
              # keeps the dead connections and fails the next request through
              # each one — reactor-netty cannot retry, since the headers are
              # already sent. Users see 500s on /api/** until the pool turns
              # over. Measured on four consecutive deploys.
              #
              # max-idle-time bounds how long an unused connection survives;
              # max-life-time bounds a *busy* one, which idle eviction alone
              # never reaches. Both must be shorter than the gap between a pod
              # going away and the next request that would reuse its connection.
              max-idle-time: 15s
              max-life-time: 60s
              eviction-interval: 15s
      # globalcors deliberately absent.
      #
      # It sat under spring.cloud.gateway.globalcors — a prefix Gateway 5.x does
      # not recognise — for this application's whole life, so it never applied.
      # Moving it into server.webflux (where the pool settings belong) switched
      # it on for the first time, which changes behaviour nobody had ever tested.
      #
      # Nothing needs it: both SPAs are served from the same origin as the API
      # they call, via the nginx in ui-shop/ui-demo, so no CORS is involved.
      # Turning on an untested filter in front of every route, to serve no
      # current caller, is risk without benefit. Re-add it under
      # server.webflux.globalcors if a genuinely cross-origin client appears —
      # and verify a preflight returns Access-Control-Allow-Origin, which the
      # activated config did not.
  codec:
    max-in-memory-size: 10MB

microservices:
  greetings:
    uri: ${MICROSERVICES_GREETINGS_URI:http://localhost:8060}
  shop:
    uri: ${MICROSERVICES_SHOP_URI:http://localhost:8061}
  payment:
    uri: ${MICROSERVICES_PAYMENT_URI:http://localhost:8062}
  auth-server:
    uri: ${MICROSERVICES_AUTH_SERVER_URI:http://localhost:9090}
  profile:
    uri: ${MICROSERVICES_PROFILE_URI:http://localhost:8064}
  delivery:
    uri: ${MICROSERVICES_DELIVERY_URI:http://localhost:8063}
  storage:
    uri: ${MICROSERVICES_STORAGE_URI:http://localhost:8065}
  spa:
    uri: ${SPA_MICROSERVICE:http://localhost:5173}
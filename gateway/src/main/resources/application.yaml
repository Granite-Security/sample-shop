server:
  port: 8080
  # Deliberately NOT set: this enables Spring's ForwardedHeaderTransformer,
  # which rewrites the exchange's own request URI from X-Forwarded-* and then
  # strips those headers from it — verified in production that this caused
  # X-Forwarded-Host from nginx to disappear before Spring Cloud Gateway's own
  # proxy filters could forward it on to auth-server, so auth-server fell back
  # to deriving its issuer from gateway's internal upstream URI
  # (http://auth-server:9090) instead of the real public domain. Gateway
  # itself doesn't need to resolve its own external URL for anything (no more
  # absolute-URL construction in RouterConfig), so leaving this off and
  # letting Spring Cloud Gateway's default proxy behavior pass the header
  # through untouched is what actually works.
spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        pool:
          # NOTE: this does not actually prevent recvAddress(-104) "Connection
          # reset by peer" — confirmed live against the storage route (see
          # RouterConfig's storage-service route comment). None of the backend
          # services configure a Netty server-side idle-timeout (grepped the
          # whole repo — there isn't one anywhere), so there's no known,
          # measured value to evict below; whatever actually tears down an
          # idle connection lives beneath the app (kernel/CNI conntrack) and
          # isn't documented or tunable here. These numbers are a best-effort
          # guess, not a fix — the real mitigation is the per-route retry
          # filter on storage-service, since presign/delete traffic is what
          # actually goes idle long enough to trigger this in practice.
          max-idle-time: 20s
          eviction-interval: 30s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8080
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Cache-Control
            max-age: 3600
  codec:
    max-in-memory-size: 10MB

microservices:
  greetings:
    uri: ${MICROSERVICES_GREETINGS_URI:http://localhost:8060}
  shop:
    uri: ${MICROSERVICES_SHOP_URI:http://localhost:8061}
  payment:
    uri: ${MICROSERVICES_PAYMENT_URI:http://localhost:8062}
  auth-server:
    uri: ${MICROSERVICES_AUTH_SERVER_URI:http://localhost:9090}
  profile:
    uri: ${MICROSERVICES_PROFILE_URI:http://localhost:8064}
  delivery:
    uri: ${MICROSERVICES_DELIVERY_URI:http://localhost:8063}
  storage:
    uri: ${MICROSERVICES_STORAGE_URI:http://localhost:8065}
  spa:
    uri: ${SPA_MICROSERVICE:http://localhost:5173}
server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8080
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Cache-Control
            max-age: 3600
  codec:
    max-in-memory-size: 10MB

microservices:
  greetings:
    uri: ${GREETINGS_MICROSERVICE:http://localhost:8060}
  shop:
    uri: ${SHOP_MICROSERVICE:http://localhost:8061}
  payment:
    uri: ${PAYMENT_MICROSERVICE:http://localhost:8062}
  auth-server:
    uri: ${AUTH_SERVER_MICROSERVICE:http://localhost:9090}
  profile:
    uri: ${PROFILE_MICROSERVICE:http://localhost:8064}
  delivery:
    uri: ${DELIVERY_MICROSERVICE:http://localhost:8063}
  spa:
    uri: ${SPA_MICROSERVICE:http://localhost:5173}
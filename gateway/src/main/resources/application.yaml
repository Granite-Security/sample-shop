server:
  port: 8080
spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        provider:
          oidc-client:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9090}
        registration:
          oidc-client:
            provider: oidc-client
            client-id: oidc-client
            client-secret: ${GATEWAY_CLIENT_SECRET:iaka}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - user.read
  codec:
    max-in-memory-size: 10MB

microservices:
  greetings:
    uri: ${GREETINGS_MICROSERVICE:http://localhost:8060}
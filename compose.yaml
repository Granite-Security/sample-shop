services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"


  shop-postgres:
    image: 'postgres:latest'
    container_name: 'shop-postgres'
    environment:
      - 'POSTGRES_DB=shopdb'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432'

  payment-postgres:
    image: 'postgres:latest'
    container_name: 'payment-postgres'
    environment:
      - 'POSTGRES_DB=paymentdb'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5434:5432'

  delivery-postgres:
    image: 'postgres:latest'
    container_name: 'delivery-postgres'
    environment:
      - 'POSTGRES_DB=deliverydb'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5435:5432'

  profile-postgres:
    image: 'postgres:latest'
    container_name: 'profile-postgres'
    environment:
      - 'POSTGRES_DB=profiledb'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5436:5432'

  notification-postgres:
    image: 'postgres:latest'
    container_name: 'notification-postgres'
    environment:
      - 'POSTGRES_DB=notificationdb'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5437:5432'

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    ports:
      - "3900:3900"   # S3 API (presigned uploads land here)
      - "3902:3902"   # S3 website endpoint (public product-media reads)
    volumes:
      - ./storage/local/garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - CLUSTER_ID=granite-cluster-id
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:29092
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=granite
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy



  auth-server:
    build:
      context: ./auth-server
    container_name: auth-server
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - AUTH_SERVER_ISSUER=http://gateway:8080/auth
      - OIDC_CLIENT_SECRET_ENCODED={noop}iaka
      - OIDC_CLIENT_REDIRECT_URI=http://localhost:8080/login/oauth2/code/oidc-client
      - OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI=http://gateway:8080/
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SERVER_PORT=9090
      - AUTH_SERVER_TOKEN_URI=http://auth-server:9090/auth/oauth2/token
      # Must match IDENTITY_ADMIN_CLIENT_SECRET on profile, the only holder.
      - IDENTITY_ADMIN_CLIENT_SECRET_ENCODED={noop}identity-admin-secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MICROSERVICES_GREETINGS_URI=http://greetings:8060
      - MICROSERVICES_SHOP_URI=http://shop:8061
      - MICROSERVICES_PAYMENT_URI=http://payment:8062
      - MICROSERVICES_PROFILE_URI=http://profile:8064
      - MICROSERVICES_DELIVERY_URI=http://delivery:8063
      - MICROSERVICES_STORAGE_URI=http://storage:8065
      - MICROSERVICES_AUTH_SERVER_URI=http://auth-server:9090
    depends_on:
      auth-server:
        condition: service_healthy

  greetings:
    build:
      context: ./greetings
    container_name: greetings
    ports:
      - "8060:8060"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_ISSUER_URI=http://gateway:8080/auth
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://gateway:8080/auth
    depends_on:
      gateway:
        condition: service_started

  shop:
    build:
      context: ./shop
    container_name: shop
    ports:
      - "8061:8061"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SHOP_R2DBC_URL=r2dbc:postgresql://shop-postgres:5432/shopdb
      - SHOP_R2DBC_USERNAME=myuser
      - SHOP_R2DBC_PASSWORD=secret
      - SHOP_JDBC_URL=jdbc:postgresql://shop-postgres:5432/shopdb
      - SHOP_JDBC_USERNAME=myuser
      - SHOP_JDBC_PASSWORD=secret
      - AUTH_ISSUER_URI=http://gateway:8080/auth
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://gateway:8080/auth
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PAYMENT_SERVICE_URI=http://payment:8062
      # shop mints an internal-scope token to ask payment about purge
      # eligibility; direct to auth-server, not through the gateway.
      - AUTH_SERVER_TOKEN_URI=http://auth-server:9090/auth/oauth2/token
      - INTERNAL_CLIENT_ID=internal-service
      - INTERNAL_CLIENT_SECRET=internal-secret
    depends_on:
      gateway:
        condition: service_started
      shop-postgres:
        condition: service_started
    restart: on-failure





  payment:
    build:
      context: ./payment
    container_name: payment
    ports:
      - "8062:8062"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PAYMENT_SERVER_PORT=8062
      - PAYMENT_R2DBC_URL=r2dbc:postgresql://payment-postgres:5432/paymentdb
      - PAYMENT_R2DBC_USERNAME=myuser
      - PAYMENT_R2DBC_PASSWORD=secret
      - PAYMENT_JDBC_URL=jdbc:postgresql://payment-postgres:5432/paymentdb
      - PAYMENT_JDBC_USERNAME=myuser
      - PAYMENT_JDBC_PASSWORD=secret
      - AUTH_ISSUER_URI=http://gateway:8080/auth
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://gateway:8080/auth
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-chf}
    depends_on:
      gateway:
        condition: service_started
      payment-postgres:
        condition: service_started
    restart: on-failure

  profile:
    build:
      context: ./profile
    container_name: profile
    ports:
      - "8064:8064"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PROFILE_SERVER_PORT=8064
      - PROFILE_R2DBC_URL=r2dbc:postgresql://profile-postgres:5432/profiledb
      - PROFILE_R2DBC_USERNAME=myuser
      - PROFILE_R2DBC_PASSWORD=secret
      - PROFILE_JDBC_URL=jdbc:postgresql://profile-postgres:5432/profiledb
      - PROFILE_JDBC_USERNAME=myuser
      - PROFILE_JDBC_PASSWORD=secret
      - AUTH_ISSUER_URI=http://gateway:8080/auth
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://gateway:8080/auth
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AUTH_SERVER_TOKEN_URI=http://auth-server:9090/auth/oauth2/token
      - MICROSERVICES_SHOP_URI=http://shop:8061
      - MICROSERVICES_PAYMENT_URI=http://payment:8062
      - MICROSERVICES_DELIVERY_URI=http://delivery:8063
      - IDENTITY_ADMIN_BASE_URI=http://auth-server:9090/auth
      - INTERNAL_CLIENT_ID=internal-service
      - INTERNAL_CLIENT_SECRET=internal-secret
      # Held only by profile — see docs/users/blocking-users.md §3.1.
      - IDENTITY_ADMIN_CLIENT_ID=identity-admin
      - IDENTITY_ADMIN_CLIENT_SECRET=identity-admin-secret
    depends_on:
      gateway:
        condition: service_started
      profile-postgres:
        condition: service_started
    restart: on-failure

  notification:
    build:
      context: ./notification
    container_name: notification
    ports:
      - "8066:8066"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NOTIFICATION_SERVER_PORT=8066
      - NOTIFICATION_R2DBC_URL=r2dbc:postgresql://notification-postgres:5432/notificationdb
      - NOTIFICATION_R2DBC_USERNAME=myuser
      - NOTIFICATION_R2DBC_PASSWORD=secret
      - NOTIFICATION_JDBC_URL=jdbc:postgresql://notification-postgres:5432/notificationdb
      - NOTIFICATION_JDBC_USERNAME=myuser
      - NOTIFICATION_JDBC_PASSWORD=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=Granite Security <no-reply@notify.granite-security.org>
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      kafka:
        condition: service_healthy
      notification-postgres:
        condition: service_started
    restart: on-failure

  storage:
    build:
      context: ./storage
    container_name: storage
    ports:
      - "8065:8065"
    environment:
      - STORAGE_SERVER_PORT=8065
      - STORAGE_S3_ENDPOINT=http://garage:3900
      - STORAGE_S3_REGION=garage
      - STORAGE_S3_BUCKET=product-media
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      # Browsers load media from Garage's website endpoint (vhost-style, *.localhost → 127.0.0.1)
      - STORAGE_PUBLIC_BASE_URL=http://product-media.localhost:3902
      - JWT_JWK_SET_URI=http://auth-server:9090/auth/oauth2/jwks
      - TRUSTED_JWT_ISSUERS=http://gateway:8080/auth
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
    depends_on:
      gateway:
        condition: service_started
      garage:
        condition: service_started
    restart: on-failure

  delivery:
    build:
      context: ./delivery
    container_name: delivery
    ports:
      - "8063:8063"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DELIVERY_SERVER_PORT=8063
      - DELIVERY_R2DBC_URL=r2dbc:postgresql://delivery-postgres:5432/deliverydb
      - DELIVERY_R2DBC_USERNAME=myuser
      - DELIVERY_R2DBC_PASSWORD=secret
      - DELIVERY_JDBC_URL=jdbc:postgresql://delivery-postgres:5432/deliverydb
      - DELIVERY_JDBC_USERNAME=myuser
      - DELIVERY_JDBC_PASSWORD=secret
      - AUTH_ISSUER_URI=http://gateway:8080/auth
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://gateway:8080/auth
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      gateway:
        condition: service_started
      delivery-postgres:
        condition: service_started
    restart: on-failure


volumes:
  garage-meta:
  garage-data:

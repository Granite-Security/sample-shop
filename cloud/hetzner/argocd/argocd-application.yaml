# ArgoCD Application that continuously deploys cloud/hetzner/app-multi from main.
#
# Applied ONCE by hand on the node (not part of the kustomization it points
# at, to avoid the app managing itself):
#   kubectl apply -f cloud/hetzner/argocd/argocd-application.yaml
#
# Repo is PUBLIC — plain https, no deploy key needed.
# Prerequisite (already true on node1): the granite-secrets Secret is applied
# by hand from k8s/base/secrets.yaml.example — it is gitignored and never
# synced; ArgoCD prune cannot touch it (no tracking label). Same goes for
# cloud/hetzner/app-multi/secrets-patch.yaml. Secret changes are always a
# manual kubectl apply on the node — ArgoCD never manages them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: granite
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Granite-Security/sample-shop.git
    targetRevision: main
    path: cloud/hetzner/app-multi
  destination:
    server: https://kubernetes.default.svc
  # Gateway/HTTPRoute .status is continuously rewritten by Traefik (conditions,
  # lastTransitionTime, attachedRoutes) — not something git or ArgoCD manages.
  # Without this, the app never settles: Traefik updates status -> ArgoCD sees
  # a diff -> selfHeal re-syncs (no-op on spec) -> Traefik updates status again.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /status
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      selfHeal: false
      # selfHeal off: out-of-band changes (manual kubectl apply/edit) are no
      # longer auto-reverted — the app just shows OutOfSync until the next
      # git-triggered sync. New commits to main still auto-deploy either way.
      # no automated prune: granite carries hand-managed objects (gateway
      # listeners, cert secrets); prune stays a deliberate manual action.
    syncOptions:
      - ServerSideApply=true

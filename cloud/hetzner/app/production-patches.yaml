# Two things every workload needs for a real VPS that k8s/base doesn't set (base is
# tuned for an unconstrained kind node): resource requests/limits, so no single pod
# can starve the others on a one-node cluster, and imagePullPolicy: IfNotPresent,
# since base hardcodes "Never" (only valid when images are `kind load`-ed locally).
#
# Numbers below are a starting point for an 8-16GB VPS, not a tuned recommendation —
# watch `kubectl top pods -n granite` after launch and adjust.

# ── JVM services ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
spec:
  template:
    spec:
      containers:
        - name: auth-server
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 500m, memory: 768Mi }
---

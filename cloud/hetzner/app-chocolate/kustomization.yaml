apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: granite

resources:
  - ../../../k8s/base
  - ../../../k8s/base/ui-demo
  - gateway.yaml

patches:
  - path: config-patch.yaml
  - path: ui-demo-patch.yaml
  - path: remove-ui-shop.yaml
  - path: production-patches.yaml
  - path: secrets-patch.yaml

# See app/kustomization.yaml for why: bump newTag on every release (recommend the
# git short SHA) and re-run `kubectl apply -k hetzner/app-chocolate` — reusing a
# floating tag like "latest" with imagePullPolicy: IfNotPresent would NOT re-pull on
# redeploy.
images:
  - name: granite-auth-server
    newName: docker.io/gluonstream/granite-auth-server
    newTag: latest
  - name: granite-gateway
    newName: docker.io/gluonstream/granite-gateway
    newTag: latest
  - name: granite-greetings
    newName: docker.io/gluonstream/granite-greetings
    newTag: latest
  - name: granite-shop
    newName: docker.io/gluonstream/granite-shop
    newTag: latest
  - name: granite-payment
    newName: docker.io/gluonstream/granite-payment
    newTag: latest
  - name: granite-profile
    newName: docker.io/gluonstream/granite-profile
    newTag: latest
  - name: granite-delivery
    newName: docker.io/gluonstream/granite-delivery
    newTag: latest
  - name: granite-ui-demo
    newName: docker.io/gluonstream/granite-ui-demo
    newTag: latest

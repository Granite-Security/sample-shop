# In kind, ui-shop's nginx terminates TLS itself using a self-signed cert mounted from
# the "granite-tls-cert" secret, and is reached via NodePort. In production, Traefik's
# Gateway terminates TLS (Let's Encrypt cert via cert-manager, see gateway.yaml) and talks
# plain HTTP to ui-shop, so that volume/port and the NodePort are dropped. Leaving the
# volume in place would crash-loop the pod anyway, since "granite-tls-cert" is never
# created here.
#
# Also retargets OIDC_AUTHORITY/OIDC_CLIENT_ID from granite-config's shared keys
# (which no longer carry a single value now that two frontends need different
# ones — see config-patch.yaml) to literal values scoped to this domain.
# valueFrom must be explicitly nulled: strategic-merge patching only adds the
# `value` field otherwise, and a container env entry can't have both `value`
# and `valueFrom` set at once (the API rejects it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-shop
spec:
  template:
    spec:
      volumes:
        - name: tls-cert
          $patch: delete
      containers:
        - name: ui-shop
          ports:
            - containerPort: 443
              $patch: delete
          volumeMounts:
            - mountPath: /etc/nginx/certs
              $patch: delete
          env:
            - name: OIDC_AUTHORITY
              value: "https://granite-security.org/auth"
              valueFrom: null
            - name: OIDC_CLIENT_ID
              value: "spa-client-shop"
              valueFrom: null
---
apiVersion: v1
kind: Service
metadata:
  name: ui-shop
spec:
  $patch: replace
  type: ClusterIP
  selector:
    app: ui-shop
  ports:
    - port: 80
      targetPort: 80
      name: http

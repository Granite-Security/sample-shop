server:
    port: 8061

spring:
  application:
    name: shop

  r2dbc:
    url: ${SHOP_R2DBC_URL:r2dbc:postgresql://localhost:5433/shopdb}
    username: ${SHOP_R2DBC_USERNAME:myuser}
    password: ${SHOP_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${SHOP_JDBC_URL:jdbc:postgresql://localhost:5433/shopdb}
    user: ${SHOP_JDBC_USERNAME:myuser}
    password: ${SHOP_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  codec:
    max-in-memory-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  security:
    oauth2:
      client:
        registration:
          # shop → payment, for the purge-eligibility check only.
          payment-client:
            client-id: ${INTERNAL_CLIENT_ID:internal-service}
            client-secret: ${INTERNAL_CLIENT_SECRET:internal-secret}
            authorization-grant-type: client_credentials
            scope: internal
            provider: auth-server
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9090/auth/oauth2/token}

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

springdoc:
  paths-to-match: /api/shop/**,/api/greetings/**

payment-service:
  uri: ${PAYMENT_SERVICE_URI:http://localhost:8062}

shop:
  # Denomination for new orders, written onto each order row so changing this later
  # cannot reinterpret history. Must match payment's shop-currency (STRIPE_CURRENCY).
  currency: ${SHOP_CURRENCY:CHF}

app:
  outbox:
    poll-interval: 5000
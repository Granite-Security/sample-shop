server:
  port: ${DELIVERY_SERVER_PORT:8063}

spring:
  application:
    name: delivery

  docker:
    compose:
      enabled: false

  r2dbc:
    url: ${DELIVERY_R2DBC_URL:r2dbc:postgresql://localhost:5435/deliverydb}
    username: ${DELIVERY_R2DBC_USERNAME:myuser}
    password: ${DELIVERY_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${DELIVERY_JDBC_URL:jdbc:postgresql://localhost:5435/deliverydb}
    user: ${DELIVERY_JDBC_USERNAME:myuser}
    password: ${DELIVERY_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

app:
  outbox:
    poll-interval: 5000

# Merge of app/production-patches.yaml + app-chocolate/production-patches.yaml:
# identical backend sizing (same backend, same sizing rationale — see the
# original comments in either source file for the full "why" on
# imagePullPolicy: Always with a floating :latest tag, and on why
# readinessProbe vs. livenessProbe initialDelaySeconds are tuned so
# differently). The only change from either source file is that BOTH the
# ui-shop and ui-demo frontend blocks are present now, since app-multi runs
# both simultaneously instead of picking one.

# ── JVM services ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
spec:
  template:
    spec:
      containers:
        - name: auth-server
          imagePullPolicy: Always
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            initialDelaySeconds: 30
          livenessProbe:
            initialDelaySeconds: 300

# ── Postgres instances ───────────────────────────────────
# Also fixes a real correctness gap: k8s/base hardcodes POSTGRES_PASSWORD as a plain
# literal instead of reading it from granite-secrets, so overriding the secret in
# secrets-patch.yaml alone would NOT change Postgres's actual password — only what
# the app clients send. This rewires Postgres itself to read from the same secret
# keys the app deployments already use (db-postgres-password / db-myuser-password).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 600m, memory: 512Mi }
          env:
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-postgres-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-shop
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 600m, memory: 512Mi }
          env:
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
---

# Same as app/production-patches.yaml — identical backend sizing, since it's the
# same backend. Only the front-end block differs: ui-demo instead of ui-shop (and
# there's no ui-shop block here at all, since remove-ui-shop.yaml already deletes
# that Deployment — patching a resource this overlay doesn't have would fail).
#
# See app/production-patches.yaml for the full rationale on imagePullPolicy: Always
# with a floating :latest tag, and on why readinessProbe vs. livenessProbe
# initialDelaySeconds are tuned so differently.

# ── JVM services ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
spec:
  template:
    spec:
      containers:
        - name: auth-server
          imagePullPolicy: Always
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            initialDelaySeconds: 30
          livenessProbe:
            initialDelaySeconds: 300
---

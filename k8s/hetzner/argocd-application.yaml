# ArgoCD Application that continuously deploys k8s/hetzner from main.
#
# Applied ONCE by hand on the node (not part of the kustomization it points
# at, to avoid the app managing itself):
#   kubectl apply -f k8s/hetzner/argocd-application.yaml
#
# Repo is PUBLIC — plain https, no deploy key needed.
# Prerequisite (already true on node1): the granite-secrets Secret is applied
# by hand from secrets.yaml.example — it is gitignored and never synced;
# ArgoCD prune cannot touch it (no tracking label).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: granite
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Granite-Security/sample-shop.git
    targetRevision: main
    path: k8s/hetzner
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      # no automated prune: granite carries hand-managed objects (gateway
      # listeners, cert secrets); prune stays a deliberate manual action.
    syncOptions:
      - ServerSideApply=true

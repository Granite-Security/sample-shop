apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: granite-alerts
  labels:
    release: kps
spec:
  groups:
    - name: granite.auth
      rules:
        # auth-server generates a fresh RSA key pair on every restart (see
        # CLAUDE.md), which invalidates every JWT issued before that restart —
        # the visible symptom across every downstream service is a spike in
        # 401 responses, not an error at auth-server itself.
        - alert: HighUnauthorizedRate
          expr: >
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code="401"}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count[5m]))
            > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 10% of requests are getting 401 Unauthorized"
            description: >-
              Sustained over 5 minutes. Likely cause: auth-server restarted,
              which regenerates its RSA signing key on every startup and
              invalidates all previously issued JWTs. Existing sessions need
              to re-authenticate.
    - name: granite.services
      rules:
        - alert: HighServerErrorRate
          expr: >
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) by (exported_job)
            /
            sum(rate(http_server_request_duration_seconds_count[5m])) by (exported_job)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.exported_job }} is returning >5% 5xx responses"
            description: >-
              Sustained over 5 minutes for service "{{ $labels.exported_job }}".
              Check its logs in Loki and recent traces in Tempo for the
              specific failing route.

# adminUser/adminPassword left unset on purpose — the chart auto-generates a
# random admin password into a Secret (kubectl get secret grafana -o
# jsonpath='{.data.admin-password}' | base64 -d) rather than storing one in
# this checked-in values file.

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  size: 5Gi

# Single replica + RWO PVC + RollingUpdate deadlocks: the new pod's
# init-chown-data container gets "Permission denied" trying to chown
# directories the still-running old pod already owns on the same hostPath
# volume, so the old pod never terminates and the new one never becomes
# ready. Recreate avoids this by tearing down the old pod first.
deploymentStrategy:
  type: Recreate

# initChownData fails with "Permission denied" on local-path's hostPath
# volume for reasons unrelated to the Recreate fix above (reproduces even
# with no other pod running). Safe to disable: the pod's own
# securityContext.fsGroup: 472 (chart default) already gets kubelet to fix
# up group ownership at mount time, making this initContainer redundant.
initChownData:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://kps-kube-prometheus-stack-prometheus.granite-observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.granite-observability.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.granite-observability.svc.cluster.local:3200
        jsonData:
          # Click a span in a trace -> jump to matching Loki logs for that
          # trace ID (this is the main ergonomic win of running all three
          # backends together instead of picking just one).
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            tags:
              - key: service.name
                value: service_name
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: service_name
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # JVM (Micrometer) dashboard — verified to actually exist on grafana.com
    # (gnetId 19004 used in an earlier draft of this values file returned a
    # 404, dashboard revision not found). Micrometer and OTel converged on
    # near-identical JVM metric names (jvm_memory_used_bytes etc.), so this
    # renders reasonably against OTel-exported data too — spot-check panels
    # once real traffic/data exists and swap for a dedicated OTel dashboard
    # if any panels come up empty.
    jvm-micrometer:
      gnetId: 4701
      revision: 1
      datasource: Prometheus
    # Custom dashboard for the request path every user request goes through
    # (source of truth: k8s/observability/grafana-dashboards/gateway-overview.json,
    # kept in sync manually — edit both if you change one).
    gateway-overview:
      json: |
        {
          "title": "Gateway Request Overview",
          "uid": "gateway-overview",
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-1h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Request rate by route",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(http_server_request_duration_seconds_count{exported_job=\"gateway\"}[$__rate_interval])) by (http_route)",
                  "legendFormat": "{{http_route}}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "p95 latency by route",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{exported_job=\"gateway\"}[$__rate_interval])) by (le, http_route))",
                  "legendFormat": "{{http_route}}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Error rate (4xx / 5xx) as % of all requests",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(http_server_request_duration_seconds_count{exported_job=\"gateway\", http_response_status_code=~\"4..|5..\"}[$__rate_interval])) by (http_response_status_code) / ignoring(http_response_status_code) group_left sum(rate(http_server_request_duration_seconds_count{exported_job=\"gateway\"}[$__rate_interval]))",
                  "legendFormat": "{{http_response_status_code}}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Requests in last 5m",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(increase(http_server_request_duration_seconds_count{exported_job=\"gateway\"}[5m]))"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
            }
          ]
        }


# Exposed via a dedicated Gateway API Gateway + HTTPRoute
# (k8s/observability/grafana-gateway.yaml), not this chart's Ingress.
ingress:
  enabled: false

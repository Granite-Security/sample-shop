apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - config.yaml
  # secrets.yaml is deliberately NOT listed: it is gitignored (see
  # secrets.yaml.example) and applied by hand once per cluster — the rendered
  # kustomization must build from a clean clone so ArgoCD can deploy it.
  - auth-server.yaml
  - gateway.yaml
  - greetings.yaml
  - shop.yaml
  - payment.yaml
  - profile.yaml
  - delivery.yaml
  - ui-shop.yaml

namespace: granite

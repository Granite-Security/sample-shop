apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - config.yaml
  # secrets.yaml is gitignored, applied by hand once per cluster (see
  # secrets.yaml.example) — not listed here so a clean clone still renders,
  # which ArgoCD requires.
  - auth-server.yaml
  - gateway.yaml
  - greetings.yaml
  - shop.yaml
  - payment.yaml
  - profile.yaml
  - delivery.yaml
  - garage.yaml
  - garage-webui.yaml
  - storage.yaml
  - ui-shop.yaml

namespace: granite

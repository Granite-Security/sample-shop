---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: backend
    spec:
      containers:
        - name: gateway
          image: granite-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "gateway"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            # Tempo speaks OTLP traces only; the agent's metric exporter 404s
            # against it every 60s. No metrics backend is wired up yet, so turn
            # the exporter off rather than spam Loki with failed exports.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Same for logs: stdout -> Alloy -> Loki is the log path, the
            # agent's OTLP log pipeline has no backend and 404s too.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JSON console logs so the agent's MDC trace_id/span_id land as real
            # fields, which is what makes Tempo -> Loki correlation work.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: GATEWAY_PORT
            - name: MICROSERVICES_AUTH_SERVER_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_AUTH_SERVER_URI
            - name: MICROSERVICES_GREETINGS_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_GREETINGS_URI
            - name: MICROSERVICES_SHOP_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_SHOP_URI
            - name: MICROSERVICES_PAYMENT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_PAYMENT_URI
            - name: MICROSERVICES_PROFILE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_PROFILE_URI
            - name: MICROSERVICES_DELIVERY_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_DELIVERY_URI
            - name: MICROSERVICES_STORAGE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_STORAGE_URI
            - name: MICROSERVICES_SPA_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_SPA_URI
          # Probe a gateway-local route (Correction 6): `/` is answered by the gateway's
          # own indexRedirect (302), so readiness no longer depends on the auth-server.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  ports:
    - port: 8080
  selector:
    app: gateway

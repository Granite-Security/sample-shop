---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    tier: backend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this is a single-replica Deployment on a
  # one-node cluster whose CPU requests sit near capacity. The default
  # rollingUpdate surges one extra pod before retiring the old one, and when
  # there is no room for both the new pod stays Pending forever while the old
  # one keeps serving — a deploy that reports a new image tag and silently runs
  # the old code, migrations and all. Terminating first costs a few seconds of
  # downtime; with one replica the rolling strategy could never avoid that
  # anyway, it could only fail to complete.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
        tier: backend
    spec:
      containers:
        - name: auth-server
          image: granite-auth-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
          env:
            - name: OTEL_SERVICE_NAME
              value: "auth-server"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            # Tempo speaks OTLP traces only; the agent's metric exporter 404s
            # against it every 60s. No metrics backend is wired up yet, so turn
            # the exporter off rather than spam Loki with failed exports.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Same for logs: stdout -> Alloy -> Loki is the log path, the
            # agent's OTLP log pipeline has no backend and 404s too.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JSON console logs so the agent's MDC trace_id/span_id land as real
            # fields, which is what makes Tempo -> Loki correlation work.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-auth:5432/authdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-postgres-password
            - name: AUTH_SERVER_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_ISSUER
            - name: OIDC_CLIENT_SECRET_ENCODED
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: oidc-client-secret-encoded
            - name: OIDC_CLIENT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_CLIENT_REDIRECT_URI
            - name: OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_REDIRECT_URI
            - name: SPA_CLIENT_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_SHOP_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_SHOP_REDIRECT_URI
            - name: SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_CHOCOLATE_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_CHOCOLATE_REDIRECT_URI
            - name: SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: google-client-secret
            - name: AUTH_SERVER_TOKEN_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_TOKEN_URI
            # Fire-and-forget producer for identity.events. auth-server has no
            # outbox and no relay by design — see NotificationEventPublisher.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
spec:
  ports:
    - port: 9090
  selector:
    app: auth-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
        tier: backend
    spec:
      containers:
        - name: auth-server
          image: granite-auth-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
          env:
            - name: OTEL_SERVICE_NAME
              value: "auth-server"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-auth:5432/authdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-postgres-password
            - name: AUTH_SERVER_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_ISSUER
            - name: OIDC_CLIENT_SECRET_ENCODED
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: oidc-client-secret-encoded
            - name: OIDC_CLIENT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_CLIENT_REDIRECT_URI
            - name: OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_REDIRECT_URI
            - name: SPA_CLIENT_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_SHOP_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_SHOP_REDIRECT_URI
            - name: SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI
            - name: SPA_CLIENT_CHOCOLATE_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_CHOCOLATE_REDIRECT_URI
            - name: SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: google-client-secret
            - name: MICROSERVICES_PROFILE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_PROFILE_URI
            - name: AUTH_SERVER_TOKEN_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_TOKEN_URI
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
spec:
  ports:
    - port: 9090
  selector:
    app: auth-server

apiVersion: v1
kind: ConfigMap
metadata:
  name: granite-config
data:
  # ── Auth Server ──────────────────────────────────────
  AUTH_SERVER_PORT: "9090"
  OIDC_CLIENT_REDIRECT_URI: "http://localhost:8080/login/oauth2/code/oidc-client"
  OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI: "http://localhost:8080/"
  # SPA (public PKCE client) callback — overlays override the host per environment.
  SPA_CLIENT_REDIRECT_URI: "http://localhost:8080/callback"
  SPA_CLIENT_POST_LOGOUT_REDIRECT_URI: "http://localhost:8080/"
  # Per-domain SPA clients (spa-client-shop / spa-client-chocolate registered
  # separately in auth-server's SecurityConfig). Defaults here match the
  # single-domain SPA_CLIENT_* values above so kind/compose keep working
  # unchanged; overlays override per real domain.
  SPA_CLIENT_SHOP_REDIRECT_URI: "http://localhost:8080/callback"
  SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI: "http://localhost:8080/"
  SPA_CLIENT_CHOCOLATE_REDIRECT_URI: "http://localhost:8080/callback"
  SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI: "http://localhost:8080/"

  # ── Gateway ──────────────────────────────────────────
  GATEWAY_PORT: "8080"
  MICROSERVICES_AUTH_SERVER_URI: "http://auth-server:9090"
  MICROSERVICES_GREETINGS_URI: "http://greetings:8060"
  MICROSERVICES_SHOP_URI: "http://shop:8061"
  MICROSERVICES_PAYMENT_URI: "http://payment:8062"
  MICROSERVICES_PROFILE_URI: "http://profile:8064"
  MICROSERVICES_DELIVERY_URI: "http://delivery:8063"
  MICROSERVICES_STORAGE_URI: "http://storage:8065"
  MICROSERVICES_SPA_URI: "http://ui-shop:80"

  # ── Greetings ────────────────────────────────────────
  GREETINGS_PORT: "8060"

  # ── Shop ─────────────────────────────────────────────
  SHOP_PORT: "8061"
  SHOP_R2DBC_URL: "r2dbc:postgresql://postgres-shop:5432/shopdb"
  SHOP_JDBC_URL: "jdbc:postgresql://postgres-shop:5432/shopdb"
  PAYMENT_SERVICE_URI: "http://payment:8062"

  # ── Payment ──────────────────────────────────────────
  PAYMENT_PORT: "8062"
  PAYMENT_R2DBC_URL: "r2dbc:postgresql://postgres-payment:5432/paymentdb"
  PAYMENT_JDBC_URL: "jdbc:postgresql://postgres-payment:5432/paymentdb"
  STRIPE_CURRENCY: "chf"
  # No Stripe webhook has ever been registered for this deployment — /sync is what
  # confirms payments. While this is false, /api/payments/webhook/stripe answers 503
  # instead of verifying deliveries against a possibly-unset secret. Flip it only
  # after registering the endpoint in the Stripe Dashboard.
  PAYMENT_PROVIDER_STRIPE_WEBHOOK_ENABLED: "false"

  # ── Profile ──────────────────────────────────────────
  PROFILE_PORT: "8064"
  PROFILE_R2DBC_URL: "r2dbc:postgresql://postgres-profile:5432/profiledb"
  PROFILE_JDBC_URL: "jdbc:postgresql://postgres-profile:5432/profiledb"
  NOTIFICATION_PORT: "8066"
  NOTIFICATION_R2DBC_URL: "r2dbc:postgresql://postgres-notification:5432/notificationdb"
  NOTIFICATION_JDBC_URL: "jdbc:postgresql://postgres-notification:5432/notificationdb"
  # Non-secret — the actual key is resend-api-key in granite-secrets.
  RESEND_FROM: "Granite Security <no-reply@notify.granite-security.org>"
  FRONTEND_ORIGIN: "https://granite-security.org"

  # ── Delivery ─────────────────────────────────────────
  DELIVERY_PORT: "8063"
  DELIVERY_R2DBC_URL: "r2dbc:postgresql://postgres-delivery:5432/deliverydb"
  DELIVERY_JDBC_URL: "jdbc:postgresql://postgres-delivery:5432/deliverydb"

  # ── Storage (+ Garage S3 backend) ─────────────────────
  STORAGE_PORT: "8065"
  # kind default: cluster-internal endpoint, fine because presigned URLs never
  # leave the cluster in kind (no browser reaching in from outside). Multi-
  # domain production overlay overrides this to a public S3 API hostname —
  # see k8s/hetzner/app-multi/config-patch.yaml for why (browsers must be able
  # to reach the exact host baked into the presigned URL).
  STORAGE_S3_ENDPOINT: "http://garage:3900"
  STORAGE_S3_REGION: "garage"
  STORAGE_S3_BUCKET: "product-media"
  STORAGE_PUBLIC_BASE_URL: "http://garage:3902"

  # ── Kafka ────────────────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # ── JWT issuer (default — override per environment) ──
  # AUTH_SERVER_ISSUER: fixed here for kind/compose (single domain). The
  # multi-domain production overlay overrides this to "" so auth-server derives
  # the issuer per-request instead (see auth-server SecurityConfig).
  AUTH_SERVER_ISSUER: "http://gateway:8080/auth"
  # Resource servers validate against an allow-list of trusted issuers (plural,
  # comma-separated) rather than Spring's single issuer-uri, since auth-server
  # can legitimately mint tokens under more than one iss. jwk-set-uri is fixed/
  # internal and domain-agnostic — same signing key regardless of which public
  # domain issued the token. Multi-domain overlays override TRUSTED_JWT_ISSUERS
  # to a comma-separated list covering every live domain.
  TRUSTED_JWT_ISSUERS: "http://gateway:8080/auth"
  JWT_JWK_SET_URI: "http://auth-server:9090/auth/oauth2/jwks"
  # Cluster-internal client-credentials token endpoint (profile calls this
  # directly, not through the gateway) — same host regardless of which public
  # domain is being served, same reasoning as JWT_JWK_SET_URI above.
  AUTH_SERVER_TOKEN_URI: "http://auth-server:9090/auth/oauth2/token"
  # Base URI for auth-server's internal user-administration API, which profile
  # calls to block/unblock/delete users. Distinct from
  # MICROSERVICES_AUTH_SERVER_URI above: that is the bare origin the gateway
  # routes to, this one carries the /auth context path the API lives under.
  IDENTITY_ADMIN_BASE_URI: "http://auth-server:9090/auth"

  # ── ui-shop runtime config (SPA reads these via window.__ENV__) ──
  # OIDC_AUTHORITY must equal the issuer above; overlays keep them in lockstep.
  OIDC_AUTHORITY: "http://gateway:8080/auth"
  OIDC_CLIENT_ID: "spa-client"

  # ── CORS (shop/payment/profile — the services the SPA calls directly) ──
  # Matches each service's own Java default exactly, so this key existing changes
  # nothing for kind. Overlays MUST override this to the real browser-facing origin
  # (see k8s/hetzner/app/config-patch.yaml) — otherwise the SPA's own fetch()
  # calls get rejected with CORS 403s that the UI just shows as a generic error,
  # even though curl-style requests (no Origin header) succeed and look fine.
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"

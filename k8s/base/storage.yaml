---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
        tier: backend
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
        # Garage has no readiness signal other than answering the S3 API — presigning
        # itself doesn't touch the network, but the storage service's own /actuator/health
        # doesn't check Garage either, so this catches a not-yet-bootstrapped bucket/key
        # before the app starts serving presign requests that would 403/404 downstream.
        - name: wait-for-garage
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://garage:3900/;
              do echo "waiting for garage..."; sleep 3; done
      containers:
        - name: storage
          image: granite-storage:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8065
          env:
            - name: OTEL_SERVICE_NAME
              value: "storage"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_PORT
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: CORS_ALLOWED_ORIGINS
            - name: STORAGE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_S3_ENDPOINT
            - name: STORAGE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_S3_REGION
            - name: STORAGE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_S3_BUCKET
            - name: STORAGE_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_PUBLIC_BASE_URL
            - name: STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: storage-s3-access-key
            - name: STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: storage-s3-secret-key
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8065
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8065
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  ports:
    - port: 8065
  selector:
    app: storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
        tier: backend
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
      containers:
        - name: shop
          image: granite-shop:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8061
          env:
            - name: OTEL_SERVICE_NAME
              value: "shop"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            # Tempo speaks OTLP traces only; the agent's metric exporter 404s
            # against it every 60s. No metrics backend is wired up yet, so turn
            # the exporter off rather than spam Loki with failed exports.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Same for logs: stdout -> Alloy -> Loki is the log path, the
            # agent's OTLP log pipeline has no backend and 404s too.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JSON console logs so the agent's MDC trace_id/span_id land as real
            # fields, which is what makes Tempo -> Loki correlation work.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SHOP_PORT
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: SHOP_R2DBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SHOP_R2DBC_URL
            - name: SHOP_R2DBC_USERNAME
              value: "myuser"
            - name: SHOP_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: SHOP_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: SHOP_JDBC_URL
            - name: SHOP_JDBC_USERNAME
              value: "myuser"
            - name: SHOP_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: PAYMENT_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_SERVICE_URI
            # shop mints an internal-scope token to ask payment whether a
            # user's orders ever moved money (purge eligibility).
            - name: AUTH_SERVER_TOKEN_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_TOKEN_URI
            - name: INTERNAL_CLIENT_ID
              value: "internal-service"
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  ports:
    - port: 8061
  selector:
    app: shop

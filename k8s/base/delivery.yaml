---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
      containers:
        - name: delivery
          image: granite-delivery:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8063
          env:
            - name: OTEL_SERVICE_NAME
              value: "delivery"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_PORT
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: DELIVERY_R2DBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_R2DBC_URL
            - name: DELIVERY_R2DBC_USERNAME
              value: "myuser"
            - name: DELIVERY_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: DELIVERY_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_JDBC_URL
            - name: DELIVERY_JDBC_USERNAME
              value: "myuser"
            - name: DELIVERY_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
spec:
  ports:
    - port: 8063
  selector:
    app: delivery

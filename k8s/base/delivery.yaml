---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  labels:
    tier: backend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this is a single-replica Deployment on a
  # one-node cluster whose CPU requests sit near capacity. The default
  # rollingUpdate surges one extra pod before retiring the old one, and when
  # there is no room for both the new pod stays Pending forever while the old
  # one keeps serving — a deploy that reports a new image tag and silently runs
  # the old code, migrations and all. Terminating first costs a few seconds of
  # downtime; with one replica the rolling strategy could never avoid that
  # anyway, it could only fail to complete.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
        tier: backend
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
      containers:
        - name: delivery
          image: granite-delivery:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8063
          env:
            - name: OTEL_SERVICE_NAME
              value: "delivery"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            # Tempo speaks OTLP traces only; the agent's metric exporter 404s
            # against it every 60s. No metrics backend is wired up yet, so turn
            # the exporter off rather than spam Loki with failed exports.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Same for logs: stdout -> Alloy -> Loki is the log path, the
            # agent's OTLP log pipeline has no backend and 404s too.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JSON console logs so the agent's MDC trace_id/span_id land as real
            # fields, which is what makes Tempo -> Loki correlation work.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_PORT
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: DELIVERY_R2DBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_R2DBC_URL
            - name: DELIVERY_R2DBC_USERNAME
              value: "myuser"
            - name: DELIVERY_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: DELIVERY_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: DELIVERY_JDBC_URL
            - name: DELIVERY_JDBC_USERNAME
              value: "myuser"
            - name: DELIVERY_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
spec:
  ports:
    - port: 8063
  selector:
    app: delivery

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-demo
  labels:
    tier: frontend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this is a single-replica Deployment on a
  # one-node cluster whose CPU requests sit near capacity. The default
  # rollingUpdate surges one extra pod before retiring the old one, and when
  # there is no room for both the new pod stays Pending forever while the old
  # one keeps serving — a deploy that reports a new image tag and silently runs
  # the old code, migrations and all. Terminating first costs a few seconds of
  # downtime; with one replica the rolling strategy could never avoid that
  # anyway, it could only fail to complete.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ui-demo
  template:
    metadata:
      labels:
        app: ui-demo
        tier: frontend
    spec:
      containers:
        - name: ui-demo
          image: granite-ui-demo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
            - containerPort: 443
          # Runtime config (Correction 4): rendered into /config.js at container start.
          env:
            - name: OIDC_AUTHORITY
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_AUTHORITY
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: OIDC_CLIENT_ID
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: stripe-publishable-key
          volumeMounts:
            - name: tls-cert
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: tls-cert
          secret:
            secretName: granite-tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: ui-demo
spec:
  ports:
    - port: 80
      name: http
    - port: 443
      name: https
  selector:
    app: ui-demo

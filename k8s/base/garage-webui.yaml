# Admin dashboard for the Garage S3 backend (k8s/base/garage.yaml) — talks to
# Garage's admin API (port 3903) to browse buckets/keys/cluster layout.
# Third-party project (not part of Garage itself): khairul169/garage-webui.
# Exposed publicly on Hetzner via garage.granite-security.org, see
# k8s/hetzner/app-multi/gateway.yaml — protected by its own AUTH_USER_PASS
# login (garage-webui-username/-password-hash in granite-secrets) since the
# admin token alone only gates the API calls the UI makes on your behalf, not
# the page itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  labels:
    tier: backend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this is a single-replica Deployment on a
  # one-node cluster whose CPU requests sit near capacity. The default
  # rollingUpdate surges one extra pod before retiring the old one, and when
  # there is no room for both the new pod stays Pending forever while the old
  # one keeps serving — a deploy that reports a new image tag and silently runs
  # the old code, migrations and all. Terminating first costs a few seconds of
  # downtime; with one replica the rolling strategy could never avoid that
  # anyway, it could only fail to complete.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage-webui
  template:
    metadata:
      labels:
        app: garage-webui
        tier: backend
    spec:
      containers:
        - name: garage-webui
          image: khairul169/garage-webui:latest
          ports:
            - containerPort: 3909
          env:
            - name: API_BASE_URL
              value: "http://garage:3903"
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: garage-admin-token
            - name: S3_ENDPOINT_URL
              value: "http://garage:3900"
            - name: S3_REGION
              value: "garage"
            - name: AUTH_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: garage-webui-auth-user-pass
---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
spec:
  ports:
    - name: http
      port: 3909
  selector:
    app: garage-webui

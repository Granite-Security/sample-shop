---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile
  template:
    metadata:
      labels:
        app: profile
        tier: backend
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
      containers:
        - name: profile
          image: granite-profile:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8064
          env:
            - name: OTEL_SERVICE_NAME
              value: "profile"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PROFILE_PORT
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: PROFILE_R2DBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PROFILE_R2DBC_URL
            - name: PROFILE_R2DBC_USERNAME
              value: "myuser"
            - name: PROFILE_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: PROFILE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PROFILE_JDBC_URL
            - name: PROFILE_JDBC_USERNAME
              value: "myuser"
            - name: PROFILE_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: MICROSERVICES_STORAGE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_STORAGE_URI
            - name: STORAGE_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STORAGE_PUBLIC_BASE_URL
            - name: AUTH_SERVER_TOKEN_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_TOKEN_URI
            - name: INTERNAL_CLIENT_ID
              value: "internal-service"
            # Phase 4 flip: RESEND_API_KEY deliberately removed. EmailService
            # log-and-skips while it is blank, so profile no longer sends mail —
            # the notification service does. The code goes in Phase 5.
---
apiVersion: v1
kind: Service
metadata:
  name: profile
spec:
  ports:
    - port: 8064
  selector:
    app: profile

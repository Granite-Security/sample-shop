---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    tier: backend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this is a single-replica Deployment on a
  # one-node cluster whose CPU requests sit near capacity. The default
  # rollingUpdate surges one extra pod before retiring the old one, and when
  # there is no room for both the new pod stays Pending forever while the old
  # one keeps serving — a deploy that reports a new image tag and silently runs
  # the old code, migrations and all. Terminating first costs a few seconds of
  # downtime; with one replica the rolling strategy could never avoid that
  # anyway, it could only fail to complete.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        tier: backend
    spec:
      # Block startup until the OIDC discovery doc is served through the gateway
      # (i.e. auth-server is up). Prevents CrashLoopBackOff on eager JWKS fetch (Correction 5).
      initContainers:
        - name: wait-for-issuer
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - >
              until curl -sf http://gateway:8080/auth/.well-known/openid-configuration;
              do echo "waiting for auth issuer..."; sleep 3; done
      containers:
        - name: payment
          image: granite-payment:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8062
          env:
            - name: OTEL_SERVICE_NAME
              value: "payment"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.infra-global-observability.svc.cluster.local:4318"
            # Tempo speaks OTLP traces only; the agent's metric exporter 404s
            # against it every 60s. No metrics backend is wired up yet, so turn
            # the exporter off rather than spam Loki with failed exports.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Same for logs: stdout -> Alloy -> Loki is the log path, the
            # agent's OTLP log pipeline has no backend and 404s too.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JSON console logs so the agent's MDC trace_id/span_id land as real
            # fields, which is what makes Tempo -> Loki correlation work.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_PORT
            # BalanceProvider reaches balance over the internal scope, so payment
            # needs client credentials and a token endpoint. Both are no-ops while
            # PAYMENT_PROVIDER_BALANCE_ENABLED is false.
            - name: INTERNAL_CLIENT_ID
              value: "internal-service"
            - name: AUTH_SERVER_TOKEN_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: AUTH_SERVER_TOKEN_URI
            - name: MICROSERVICES_BALANCE_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: MICROSERVICES_BALANCE_URI
            - name: PAYMENT_PROVIDER_BALANCE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_PROVIDER_BALANCE_ENABLED
            - name: TRUSTED_JWT_ISSUERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: TRUSTED_JWT_ISSUERS
            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: JWT_JWK_SET_URI
            - name: PAYMENT_R2DBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_R2DBC_URL
            - name: PAYMENT_R2DBC_USERNAME
              value: "myuser"
            - name: PAYMENT_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: PAYMENT_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_JDBC_URL
            - name: PAYMENT_JDBC_USERNAME
              value: "myuser"
            - name: PAYMENT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: db-myuser-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: stripe-webhook-secret
            - name: STRIPE_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STRIPE_CURRENCY
            - name: PAYMENT_PROVIDER_STRIPE_WEBHOOK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_PROVIDER_STRIPE_WEBHOOK_ENABLED
            # optional: true on all three, unlike every other secretKeyRef here.
            # PayPal is genuinely optional (payment.providers.paypal.enabled
            # defaults false), and granite-secrets is applied by hand rather than
            # by ArgoCD — so without this, rolling out this manifest before
            # someone remembers to add the keys puts payment into
            # CreateContainerConfigError and takes *all* payments down, Stripe
            # included. A blank client id fails PayPal's health check loudly
            # instead, which is a far better failure.
            - name: PAYPAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: paypal-client-id
                  optional: true
            - name: PAYPAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: paypal-client-secret
                  optional: true
            - name: PAYPAL_WEBHOOK_ID
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: paypal-webhook-id
                  optional: true
            - name: PAYPAL_ENV
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYPAL_ENV
            - name: PAYMENT_PROVIDER_PAYPAL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_PROVIDER_PAYPAL_ENABLED
            - name: PAYMENT_PROVIDER_PAYPAL_WEBHOOK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PAYMENT_PROVIDER_PAYPAL_WEBHOOK_ENABLED
            # Where PayPal returns the shopper to (the gateway), and where they land
            # afterwards (the SPA). Identical here because one domain serves both.
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: PUBLIC_BASE_URL
            - name: STOREFRONT_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: STOREFRONT_ORIGINS
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: granite-config
                  key: FRONTEND_ORIGIN
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  ports:
    - port: 8062
  selector:
    app: payment

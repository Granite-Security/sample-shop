# Trust an already-set X-Forwarded-Proto from an upstream proxy (e.g. Traefik terminating
# TLS in front of us) instead of blindly overwriting it with our own $scheme, which is
# always "http" once TLS is terminated upstream of this container. Falls back to $scheme
# when there's no upstream value (e.g. nginx itself is the TLS-terminating edge, as in kind).
map $http_x_forwarded_proto $granite_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

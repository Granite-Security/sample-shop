# One-time cluster-scoped resource. Apply after cert-manager is installed:
#   kubectl apply -f hetzner/platform/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mr.vrabie@gmail.com # change if you want renewal/expiry notices elsewhere
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

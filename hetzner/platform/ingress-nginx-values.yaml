# Helm values for ingress-nginx on a single bare-metal node (no cloud LoadBalancer
# available on a plain Hetzner VPS). Runs the controller as a hostNetwork DaemonSet
# bound directly to the node's public IP on 80/443, which is what Cloudflare's DNS
# record will point at.
controller:
  kind: DaemonSet
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  service:
    type: ClusterIP
  ingressClassResource:
    name: nginx
    default: true
  publishService:
    enabled: false

# TLS terminates here (cert-manager + Let's Encrypt), then forwards plain HTTP to
# ui-shop's nginx, which already knows how to proxy /api, /auth, /oauth2 to the
# gateway (see k8s/base/ui-shop.yaml and the kind ui-shop-patch.yaml comments).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: granite-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - granite-security.net
      secretName: granite-security-net-tls
  rules:
    - host: granite-security.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-shop
                port:
                  number: 80

# In kind, ui-shop's nginx terminates TLS itself using a self-signed cert mounted from
# the "granite-tls-cert" secret, and is reached via NodePort. In production, ingress-nginx
# terminates TLS (Let's Encrypt cert via cert-manager, see ingress.yaml) and talks plain
# HTTP to ui-shop, so that volume/port and the NodePort are dropped. Leaving the volume in
# place would crash-loop the pod anyway, since "granite-tls-cert" is never created here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-shop
spec:
  template:
    spec:
      volumes:
        - name: tls-cert
          $patch: delete
      containers:
        - name: ui-shop
          ports:
            - containerPort: 443
              $patch: delete
          volumeMounts:
            - mountPath: /etc/nginx/certs
              $patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: ui-shop
spec:
  $patch: replace
  type: ClusterIP
  selector:
    app: ui-shop
  ports:
    - port: 80
      targetPort: 80
      name: http

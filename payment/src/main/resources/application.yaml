server:
  port: ${PAYMENT_SERVER_PORT:8062}

spring:
  application:
    name: payment

  r2dbc:
    url: ${PAYMENT_R2DBC_URL:r2dbc:postgresql://localhost:5434/paymentdb}
    username: ${PAYMENT_R2DBC_USERNAME:myuser}
    password: ${PAYMENT_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5434/paymentdb}
    user: ${PAYMENT_JDBC_USERNAME:myuser}
    password: ${PAYMENT_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

spring.security.oauth2.client:
  registration:
    # Used only by BalanceProvider, to reach balance's SCOPE_internal intent API.
    balance-client:
      client-id: ${INTERNAL_CLIENT_ID:internal-service}
      client-secret: ${INTERNAL_CLIENT_SECRET:internal-secret}
      authorization-grant-type: client_credentials
      scope: internal
      provider: auth-server
  provider:
    auth-server:
      token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9090/auth/oauth2/token}

microservices:
  balance:
    uri: ${MICROSERVICES_BALANCE_URI:http://localhost:8067}

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  # Default matches the local `stripe listen` forwarding session
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_321e0f4f965220007dec238f31d6ec4706ebdb81e0062631a2fedde90e1c2d70}
  currency: ${STRIPE_CURRENCY:chf}

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  # Not a secret in the whsec_ sense — an identifier for the webhook subscription,
  # required to verify a delivery. Blank means verification cannot succeed, which
  # is why the webhook switch below stays off until it is set.
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  # sandbox | live. Decides the API base URL. Never inferred from the credentials:
  # PayPal keys carry no test/live prefix the way Stripe's sk_test_ does, so an
  # inferred mode would silently take real money.
  env: ${PAYPAL_ENV:sandbox}

payment:
  # The one currency the shop prices in. Validated at startup against the closed
  # set (USD, EUR, CHF) and against every enabled provider's supported set, so a
  # provider that cannot charge it fails the boot rather than the first order.
  # RON was dropped when PayPal landed — PayPal does not settle it.
  shop-currency: ${PAYMENT_SHOP_CURRENCY:${STRIPE_CURRENCY:chf}}
  providers:
    stripe:
      enabled: ${PAYMENT_PROVIDER_STRIPE_ENABLED:true}
      webhook:
        # No webhook has ever been registered for this deployment — /sync is what
        # confirms payments. Turn this on only once the endpoint exists in the
        # Stripe dashboard; until then payment refuses deliveries rather than
        # verifying them against an unset secret.
        enabled: ${PAYMENT_PROVIDER_STRIPE_WEBHOOK_ENABLED:false}
    paypal:
      # Off by default, deliberately. Enabling it is what makes the shop
      # multi-provider, and that flips POST /api/shop/orders into *requiring* an
      # explicit provider — a 400 for any caller that omits it. That should be a
      # decision, not a side effect of picking up new config.
      enabled: ${PAYMENT_PROVIDER_PAYPAL_ENABLED:false}
      webhook:
        # Unlike Stripe, where the webhook is belt-and-braces over /sync, PayPal
        # needs it: a shopper who approves and then closes the tab never hits the
        # return endpoint, and CHECKOUT.ORDER.APPROVED is what captures the money
        # in that case. See docs/payment/paypal.md §3.4.
        enabled: ${PAYMENT_PROVIDER_PAYPAL_WEBHOOK_ENABLED:false}
    balance:
      # Off by default for the same reason as PayPal: enabling a second provider
      # makes the shop multi-provider, which turns POST /api/shop/orders into
      # *requiring* an explicit provider. That should be a decision.
      # There is no webhook block — balance has nothing to call us back with, so
      # the return endpoint plus /sync are what confirm it.
      enabled: ${PAYMENT_PROVIDER_BALANCE_ENABLED:false}

app:
  outbox:
    poll-interval: 5000
  # Where PayPal sends the shopper back to — must reach *this service* through the
  # gateway, so it is the API origin, not the SPA's. Built here rather than from a
  # request header because payments are opened by a Kafka consumer with no HTTP
  # request in flight.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # Where the shopper finally lands after capture. The SPA's origin, which differs
  # from the API's in local dev (5173 vs 8080) and is identical to it in k8s.
  # Reuses the variable notification already builds password-reset links from.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  # Storefronts this service may redirect a shopper to. The resolved per-request origin
  # is checked against this before it reaches a 302, so a forged Origin header cannot
  # turn the payment return into an open redirect (docs/bugs/redirects.md §4.4).
  # Shares CORS_ALLOWED_ORIGINS rather than adding a second list that can drift out of
  # sync with it — the domains that may call us are the domains we may return to.
  # frontend-origin above is always trusted and is the fallback.
  storefront-origins: ${STOREFRONT_ORIGINS:${CORS_ALLOWED_ORIGINS:}}

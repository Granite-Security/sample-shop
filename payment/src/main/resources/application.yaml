server:
  port: ${PAYMENT_SERVER_PORT:8062}

spring:
  application:
    name: payment

  r2dbc:
    url: ${PAYMENT_R2DBC_URL:r2dbc:postgresql://localhost:5434/paymentdb}
    username: ${PAYMENT_R2DBC_USERNAME:myuser}
    password: ${PAYMENT_R2DBC_PASSWORD:secret}

  liquibase:
    url: ${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5434/paymentdb}
    user: ${PAYMENT_JDBC_USERNAME:myuser}
    password: ${PAYMENT_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:${AUTH_ISSUER_URI:http://localhost:8080/auth}}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  outbox:
    poll-interval: 5000

server:
  port: ${PAYMENT_SERVER_PORT:8062}

spring:
  application:
    name: payment

  r2dbc:
    url: ${PAYMENT_R2DBC_URL:r2dbc:postgresql://localhost:5434/paymentdb}
    username: ${PAYMENT_R2DBC_USERNAME:myuser}
    password: ${PAYMENT_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5434/paymentdb}
    user: ${PAYMENT_JDBC_USERNAME:myuser}
    password: ${PAYMENT_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:${AUTH_ISSUER_URI:http://localhost:8080/auth}}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  # Default matches the local `stripe listen` forwarding session
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_321e0f4f965220007dec238f31d6ec4706ebdb81e0062631a2fedde90e1c2d70}
  currency: ${STRIPE_CURRENCY:usd}

app:
  outbox:
    poll-interval: 5000

server:
  port: ${PAYMENT_SERVER_PORT:8062}

spring:
  application:
    name: payment

  r2dbc:
    url: ${PAYMENT_R2DBC_URL:r2dbc:postgresql://localhost:5434/paymentdb}
    username: ${PAYMENT_R2DBC_USERNAME:myuser}
    password: ${PAYMENT_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5434/paymentdb}
    user: ${PAYMENT_JDBC_USERNAME:myuser}
    password: ${PAYMENT_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  # Default matches the local `stripe listen` forwarding session
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_321e0f4f965220007dec238f31d6ec4706ebdb81e0062631a2fedde90e1c2d70}
  currency: ${STRIPE_CURRENCY:chf}

payment:
  # The one currency the shop prices in. Validated at startup against the closed
  # set (USD, EUR, RON, CHF) and against every enabled provider's supported set,
  # so a provider that cannot charge it fails the boot rather than the first order.
  shop-currency: ${PAYMENT_SHOP_CURRENCY:${STRIPE_CURRENCY:chf}}
  providers:
    stripe:
      enabled: ${PAYMENT_PROVIDER_STRIPE_ENABLED:true}
      webhook:
        # No webhook has ever been registered for this deployment — /sync is what
        # confirms payments. Turn this on only once the endpoint exists in the
        # Stripe dashboard; until then payment refuses deliveries rather than
        # verifying them against an unset secret.
        enabled: ${PAYMENT_PROVIDER_STRIPE_WEBHOOK_ENABLED:false}

app:
  outbox:
    poll-interval: 5000

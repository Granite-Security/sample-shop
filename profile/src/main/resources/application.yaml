server:
  port: ${PROFILE_SERVER_PORT:8064}

spring:
  application:
    name: profile

  docker:
    compose:
      enabled: false

  r2dbc:
    url: ${PROFILE_R2DBC_URL:r2dbc:postgresql://localhost:5436/profiledb}
    username: ${PROFILE_R2DBC_USERNAME:myuser}
    password: ${PROFILE_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${PROFILE_JDBC_URL:jdbc:postgresql://localhost:5436/profiledb}
    user: ${PROFILE_JDBC_USERNAME:myuser}
    password: ${PROFILE_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

  security:
    oauth2:
      client:
        registration:
          storage-client:
            client-id: ${INTERNAL_CLIENT_ID:internal-service}
            client-secret: ${INTERNAL_CLIENT_SECRET:internal-secret}
            authorization-grant-type: client_credentials
            scope: internal
            provider: auth-server
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9090/auth/oauth2/token}

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

microservices:
  storage:
    uri: ${MICROSERVICES_STORAGE_URI:http://localhost:8065}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://product-media.localhost:3902}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Granite Security <no-reply@notify.granite-security.org>}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}

server:
  port: ${PROFILE_SERVER_PORT:8064}

spring:
  application:
    name: profile

  docker:
    compose:
      enabled: false

  r2dbc:
    url: ${PROFILE_R2DBC_URL:r2dbc:postgresql://localhost:5436/profiledb}
    username: ${PROFILE_R2DBC_USERNAME:myuser}
    password: ${PROFILE_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${PROFILE_JDBC_URL:jdbc:postgresql://localhost:5436/profiledb}
    user: ${PROFILE_JDBC_USERNAME:myuser}
    password: ${PROFILE_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

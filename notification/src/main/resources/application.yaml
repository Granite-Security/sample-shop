server:
  port: ${NOTIFICATION_SERVER_PORT:8066}

spring:
  application:
    name: notification

  docker:
    compose:
      enabled: false

  r2dbc:
    url: ${NOTIFICATION_R2DBC_URL:r2dbc:postgresql://localhost:5437/notificationdb}
    username: ${NOTIFICATION_R2DBC_USERNAME:myuser}
    password: ${NOTIFICATION_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  liquibase:
    url: ${NOTIFICATION_JDBC_URL:jdbc:postgresql://localhost:5437/notificationdb}
    user: ${NOTIFICATION_JDBC_USERNAME:myuser}
    password: ${NOTIFICATION_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

notification:
  send:
    # The Phase 4 flip: set false to stop this service sending without redeploying
    # auth-server. Independent of resend.api-key, which disables the email channel
    # specifically.
    enabled: ${NOTIFICATION_SEND_ENABLED:true}
  # Used to build the password-reset link from the token carried on the event, so
  # auth-server never needs to know the frontend URL shape.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Granite Security <no-reply@notify.granite-security.org>}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}

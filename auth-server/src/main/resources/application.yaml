server:
  port: 9090
  servlet:
    context-path: /auth
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: trace

spring:
  application:
    name: auth-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_SERVER_ISSUER:http://localhost:8080/auth}

app:
  oauth2:
    gateway-client:
      secret: ${OIDC_CLIENT_SECRET_ENCODED:{noop}secret}
      redirect-uri: ${OIDC_CLIENT_REDIRECT_URI:http://localhost:8080/login/oauth2/code/oidc-client}
      post-logout-redirect-uri: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}
    spa-client:
      redirect-uri: ${SPA_CLIENT_REDIRECT_URI:http://localhost:5173/callback}
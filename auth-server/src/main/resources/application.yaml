server:
  port: 9090
  servlet:
    context-path: /auth
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: trace

spring:
  application:
    name: auth-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      authorizationserver:
        # Leave blank in production (app-multi overlay) so the issuer is
        # derived per-request instead of fixed to one domain. kind/compose set
        # AUTH_SERVER_ISSUER explicitly since they only ever serve one domain.
        issuer: ${AUTH_SERVER_ISSUER:http://localhost:8080/auth}

app:
  oauth2:
    gateway-client:
      secret: ${OIDC_CLIENT_SECRET_ENCODED:{noop}secret}
      redirect-uri: ${OIDC_CLIENT_REDIRECT_URI:http://localhost:8080/login/oauth2/code/oidc-client}
      post-logout-redirect-uri: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}
    spa-client-shop:
      redirect-uri: ${SPA_CLIENT_SHOP_REDIRECT_URI:${SPA_CLIENT_REDIRECT_URI:http://localhost:5173/callback}}
      post-logout-redirect-uri: ${SPA_CLIENT_SHOP_POST_LOGOUT_REDIRECT_URI:${SPA_CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:5173}}
    spa-client-chocolate:
      redirect-uri: ${SPA_CLIENT_CHOCOLATE_REDIRECT_URI:http://localhost:5173/callback}
      post-logout-redirect-uri: ${SPA_CLIENT_CHOCOLATE_POST_LOGOUT_REDIRECT_URI:http://localhost:5173}
    external-client:
      secret: ${EXTERNAL_CLIENT_SECRET:{noop}my-secret}
    internal-service:
      # Distinct literal from external-client's default above — Spring's
      # InMemoryRegisteredClientRepository rejects two registered clients
      # that resolve to the same secret, which crashed auth-server in prod
      # when both fell back to their unset-env-var defaults simultaneously.
      secret: ${INTERNAL_CLIENT_SECRET_ENCODED:{noop}internal-secret}
      # Raw counterpart of the encoded secret above — same value profile
      # already sends as its own client-secret when calling storage. Used
      # when auth-server itself acts as this client to call profile.
      raw-secret: ${INTERNAL_CLIENT_SECRET:internal-secret}

microservices:
  profile:
    uri: ${MICROSERVICES_PROFILE_URI:http://localhost:8064}
server:
  port: ${ACCOUNTING_SERVER_PORT:8068}

spring:
  application:
    name: accounting

  docker:
    compose:
      enabled: false

  r2dbc:
    url: ${ACCOUNTING_R2DBC_URL:r2dbc:postgresql://localhost:5439/accountingdb}
    username: ${ACCOUNTING_R2DBC_USERNAME:myuser}
    password: ${ACCOUNTING_R2DBC_PASSWORD:secret}
    pool:
      enabled: true
      validation-query: SELECT 1
      max-idle-time: 5m

  # Liquibase is JDBC-only; the application itself never uses this connection.
  liquibase:
    url: ${ACCOUNTING_JDBC_URL:jdbc:postgresql://localhost:5439/accountingdb}
    user: ${ACCOUNTING_JDBC_USERNAME:myuser}
    password: ${ACCOUNTING_JDBC_PASSWORD:secret}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The books must see every fact that was ever published, including the ones
      # produced before this service existed.
      auto-offset-reset: earliest
      # Committing only after the fact is stored is what makes a crash replay rather
      # than silently skip. A skipped fact is money that never reaches the books.
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      # Only ever used by the dead-letter recoverer; accounting publishes no events of
      # its own. It is the last service that should be telling anyone anything.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

# No spring.security.oauth2.client here, and that is deliberate: accounting never calls
# another service (docs/finance/accounting.md D25). If it needs a number, the event
# carries it — the moment it asks shop what a product cost, a report depends on a live
# service and the books stop being reproducible.

springdoc:
  paths-to-match: /api/accounting/**
  swagger-ui:
    operations-sorter: method

jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/auth/oauth2/jwks}
  trusted-issuers: ${TRUSTED_JWT_ISSUERS:http://localhost:8080/auth}

accounting:
  # The books start on a date (D22). Kafka retention has already deleted history, so
  # there is nothing to replay: facts older than this are recorded and never posted, and
  # every report before it is cash view only. Moving this date later abandons entries
  # that were already booked — set it once, when the opening balance is posted.
  books-open-on: ${ACCOUNTING_BOOKS_OPEN_ON:2026-09-01}
  sweep:
    # Retries facts whose prerequisites had not arrived. Out-of-order across four topics
    # is ordinary, so this runs often and cheaply.
    interval: ${ACCOUNTING_SWEEP_INTERVAL:30000}
    batch-size: ${ACCOUNTING_SWEEP_BATCH_SIZE:200}

  # The cost assumptions of §2.8. Every one of them is a stated assumption and not a
  # measurement, which is why they live together and are named — a 3% fee scattered
  # through posting rules would read like a fact.
  costs:
    processor-fee-percent: ${ACCOUNTING_PROCESSOR_FEE_PERCENT:3.0}
    processor-fee-fixed-minor: ${ACCOUNTING_PROCESSOR_FEE_FIXED:30}
    shipping-minor: ${ACCOUNTING_SHIPPING_MINOR:100}

  # Expected returns (§2.2). The rate is measured off delivered-vs-refunded facts once
  # there are enough of them; below that the stated default is used and the journal says
  # which it was. A 0% return rate is also an assumption, and a more misleading one.
  returns:
    trailing-days: ${ACCOUNTING_RETURNS_TRAILING_DAYS:180}
    default-rate: ${ACCOUNTING_RETURNS_DEFAULT_RATE:0.02}
    minimum-observations: ${ACCOUNTING_RETURNS_MIN_OBSERVATIONS:20}

  estimates:
    # Daily, not monthly. A monthly trigger that fires while the pod is restarting is a
    # month with no provision and nobody noticing; these postings are idempotent per
    # period, so a daily run either does the work or finds it already done.
    cron: ${ACCOUNTING_ESTIMATES_CRON:0 30 2 * * *}

  # The one stated fixed asset (§14.3, D32): CHF 5,000 straight line over ten years, nil
  # residual. 41.67 x 120 is 5,000.40, so the final month posts the balancing 41.27 — a
  # schedule that posts a fixed rounded amount every period over-depreciates.
  depreciation:
    cost-minor: ${ACCOUNTING_EQUIPMENT_COST_MINOR:500000}
    monthly-minor: ${ACCOUNTING_DEPRECIATION_MONTHLY_MINOR:4167}
    life-months: ${ACCOUNTING_EQUIPMENT_LIFE_MONTHS:120}

  # IFRS 9 provision matrix (§2.6). THESE RATES ARE ASSUMPTIONS. There is no repayment
  # history to derive them from, so every figure built on them is labelled an estimate and
  # carries as-of. A provision matrix with invented rates presented as a measured figure is
  # worse than no provision at all.
  #
  # If this starts reporting a large allowance, the fix is a credit limit in balance's
  # CreditPolicy, not a change to these numbers: a high expected default means the platform
  # is giving stock away, which is a product bug and not a reporting one (§2.5).
  ecl:
    as-of: ${ACCOUNTING_ECL_AS_OF:2026-08-09}
    bands:
      - { max-age-days: 30, loss-rate: 0.05 }
      - { max-age-days: 60, loss-rate: 0.20 }
      - { max-age-days: 90, loss-rate: 0.50 }
      - { max-age-days: null, loss-rate: 1.00 }

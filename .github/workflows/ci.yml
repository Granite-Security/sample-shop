name: CI

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.detect.outputs.jvm }}
      ui: ${{ steps.detect.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: detect
        run: |
          set -euo pipefail

          # HEAD^ may not exist for the very first commit on the branch history available.
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git diff --name-only "$(git hash-object -t tree /dev/null)" HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED"

          jvm_services=(auth-server gateway greetings payment profile notification shop delivery storage balance accounting demo-kot)
          ui_services=(ui-demo ui-shop)

          jvm_arr=()
          for s in "${jvm_services[@]}"; do
            if echo "$CHANGED" | grep -q "^$s/"; then
              jvm_arr+=("\"$s\"")
            fi
          done

          ui_arr=()
          for s in "${ui_services[@]}"; do
            if echo "$CHANGED" | grep -q "^$s/"; then
              ui_arr+=("\"$s\"")
            fi
          done

          jvm_json="[$(IFS=,; echo "${jvm_arr[*]:-}")]"
          ui_json="[$(IFS=,; echo "${ui_arr[*]:-}")]"

          echo "jvm services changed: $jvm_json"
          echo "ui services changed: $ui_json"

          echo "jvm=$jvm_json" >> "$GITHUB_OUTPUT"
          echo "ui=$ui_json" >> "$GITHUB_OUTPUT"

  build-jvm:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.jvm != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.jvm) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build (no tests)
        working-directory: ${{ matrix.service }}
        run: ./gradlew build -x test

  build-ui:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ui != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.ui) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

  docker-jvm:
    name: Docker build/push ${{ matrix.service }}
    needs: [detect-changes, build-jvm]
    if: needs.detect-changes.outputs.jvm != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.jvm) }}
        exclude:
          - service: demo-kot # no Dockerfile, not deployed
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            moldovean/granite-${{ matrix.service }}:latest
            moldovean/granite-${{ matrix.service }}:${{ github.sha }}

  docker-ui:
    name: Docker build/push ${{ matrix.service }}
    needs: [detect-changes, build-ui]
    if: needs.detect-changes.outputs.ui != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.ui) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            moldovean/granite-${{ matrix.service }}:latest
            moldovean/granite-${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    name: Bump image tags in app-multi
    needs: [detect-changes, build-jvm, build-ui, docker-jvm, docker-ui]
    # The build jobs are guarded as well as the docker ones. A failed build leaves
    # its docker job *skipped*, not failed, so a guard that only excludes 'failure'
    # let the bump run and write a tag for an image that was never pushed — which is
    # how ui-shop and ui-demo came to point at 0c8adc55, a tag that does not exist on
    # Docker Hub. Nothing is bumped unless everything that had to build, built.
    if: |
      always() &&
      (needs.detect-changes.outputs.jvm != '[]' || needs.detect-changes.outputs.ui != '[]') &&
      needs.build-jvm.result != 'failure' &&
      needs.build-ui.result != 'failure' &&
      needs.docker-jvm.result != 'failure' &&
      needs.docker-ui.result != 'failure'
    runs-on: ubuntu-latest
    # Two merges landing close together produce two runs whose bump jobs both commit
    # to main; without this the loser's push is rejected and the run fails. Queued,
    # not cancelled: every merged SHA still gets its tags written.
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Bump newTag for changed services
        env:
          JVM_SERVICES: ${{ needs.detect-changes.outputs.jvm }}
          UI_SERVICES: ${{ needs.detect-changes.outputs.ui }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE=k8s/hetzner/app-multi/kustomization.yaml

          for svc in $(echo "$JVM_SERVICES" | jq -r '.[]'); do
            [ "$svc" = "demo-kot" ] && continue # not dockerized/deployed
            yq -i "(.images[] | select(.name == \"granite-$svc\")).newTag = \"$SHA\"" "$FILE"
          done

          for svc in $(echo "$UI_SERVICES" | jq -r '.[]'); do
            yq -i "(.images[] | select(.name == \"granite-$svc\")).newTag = \"$SHA\"" "$FILE"
          done

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/hetzner/app-multi/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): bump image tags to ${SHA} [skip ci]"

          # main may have moved since checkout — another run's bump, or a merge that
          # landed while the images were building. Rebase onto it and retry rather
          # than failing: this commit touches one file that no human edits, so a
          # rebase here cannot conflict with anything but another bump.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          git push
